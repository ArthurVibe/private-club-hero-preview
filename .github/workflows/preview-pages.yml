name: Publish approved Hero v2.0 preview

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hero-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'ArthurVibe/private-club-hero-preview'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the approved static copy
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage unchanged website files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/assets
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v5
